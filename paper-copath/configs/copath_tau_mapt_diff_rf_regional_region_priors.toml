[model]
name = "DIFF-RF-REGIONAL"
transport = "retrograde"
parameter_sharing = "independent"

[data]
network = "paper-copath/data/network.csv"
observations = "paper-copath/data/tau_pathology_mapt.csv"
region_label_style = "allen_mouse_ccfv3"

[seeding]
seed_indices = [54]
infer_seed = true

[inference]
n_chains = 1
target_acceptance = 0.65
sampler = "NUTS"
n_samples = 1000
n_warmup = 1000
mean_data = false
ignore_seed = false

[priors.posterior]
source = "paper-copath/results/diff_rf_regional_priors/tau_mapt_region_rf_prior_source.h5"
patterns = ["alpha[*]", "beta[*]", "gamma[*]"]
widen = 2.5
min_sd = 1e-6

[holdout]
strategy = "none"
