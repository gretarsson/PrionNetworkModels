[model]
name = "DIFF-RF"
transport = "retrograde"
parameter_sharing = "independent"

[data]
network = "data/paper/hippocampus/network.csv"
observations = "data/paper/hippocampus/observations.csv"

[seeding]
seed_indices = [53, 55, 56]
infer_seed = true

[inference]
n_chains = 1
target_acceptance = 0.65
sampler = "NUTS"
n_samples = 1000
n_warmup = 1000
mean_data = false

[holdout]
strategy = "none"
